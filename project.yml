name: MeltingCheese
options:
  bundleIdPrefix: food.meltingcheese
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  MeltingCheese:
    type: application
    platform: iOS
    sources:
      - path: MeltingCheese
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Melting Cheese
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        # iPhone runs portrait only; iPad must advertise all four
        # orientations or App Store Connect rejects the bundle (error 90474).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Locked to Light because the palette in Theme.swift is a fixed light
        # one. This used to say Dark, which left every system-drawn surface —
        # alerts, action sheets, the keyboard, text selection — rendering dark
        # against a near-white app. Following the system instead would break
        # the same way for anyone with dark mode on, since the brand colours
        # are hardcoded rather than semantic.
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: food.meltingcheese.app
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
