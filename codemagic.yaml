workflows:
  ios-testflight:
    name: Melting Cheese iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Apple Developer Portal key already connected to this Codemagic account.
    integrations:
      app_store_connect: TRT_ASC_KEY

    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "food.meltingcheese.app"
        XCODE_SCHEME: "MeltingCheese"
        XCODE_PROJECT: "MeltingCheese.xcodeproj"
        APP_STORE_APP_ID: 6799911811

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml

      - name: Create signing certificate and profile
        script: |
          set -e
          # Creating a distribution certificate requires a private key.
          # Use CERTIFICATE_PRIVATE_KEY if it is configured, otherwise generate
          # a key for this build so the very first run can bootstrap signing.
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@file:/tmp/cert_key --create
          else
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          fi

      - name: Add certificates to keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Set build number from TestFlight
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
          NEXT=$(($LATEST + 1))
          echo "Using build number $NEXT"
          agvtool new-version -all $NEXT

      - name: Build ipa
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - pantherdxpro@gmail.com
        notify:
          success: true
          failure: true
