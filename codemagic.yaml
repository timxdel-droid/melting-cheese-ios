workflows:
  ios-testflight:
    name: Melting Cheese iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Apple Developer Portal key already connected to this Codemagic account.
    integrations:
      app_store_connect: TRT_ASC_KEY

    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "food.meltingcheese.app"
        XCODE_SCHEME: "MeltingCheese"
        XCODE_PROJECT: "MeltingCheese.xcodeproj"
        APP_STORE_APP_ID: 6799911811

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Ensure app icon exists
        script: |
          set -e
          ICON_DIR=MeltingCheese/Assets.xcassets/AppIcon.appiconset
          ICON="$ICON_DIR/AppIcon-1024.png"
          mkdir -p "$ICON_DIR"
          if [ -f "$ICON" ]; then echo "Using the committed app icon."; exit 0; fi
          echo "No icon committed - generating a branded placeholder."
          pip3 install --quiet --disable-pip-version-check pillow
          cat > /tmp/mkicon.py <<'PYEOF'
          import sys
          from PIL import Image, ImageDraw
          S = 1024
          img = Image.new('RGB', (S, S), (14, 12, 10))
          d = ImageDraw.Draw(img, 'RGBA')
          cx, cy = S // 2, int(S * 0.47)
          w, h, depth = int(S * 0.30), int(S * 0.17), int(S * 0.22)
          top = [(cx, cy - h * 2), (cx + w, cy - h), (cx, cy), (cx - w, cy)]
          left = [(cx - w, cy), (cx, cy), (cx, cy + depth), (cx - w, cy + depth - h)]
          right = [(cx, cy), (cx + w, cy - h), (cx + w, cy + depth - h), (cx, cy + depth)]
          d.polygon(right, fill=(214, 113, 22))
          d.polygon(left, fill=(232, 133, 32))
          d.polygon(top, fill=(245, 166, 35))
          for hx, hy, r in [(cx - 70, cy - 150, 58), (cx + 95, cy - 95, 44), (cx - 10, cy - 60, 36)]:
              d.ellipse([hx - r, hy - r // 2, hx + r, hy + r // 2], fill=(196, 104, 18))
          dy = cy + depth
          d.rounded_rectangle([cx - w, dy - 30, cx + w, dy + 34], radius=26, fill=(245, 166, 35))
          for dx, dl, dr in [(-150, 120, 40), (-30, 180, 52), (110, 140, 44)]:
              x = cx + dx
              d.rounded_rectangle([x - dr // 2, dy, x + dr // 2, dy + dl], radius=dr // 2, fill=(245, 166, 35))
              d.ellipse([x - dr // 2, dy + dl - dr // 2, x + dr // 2, dy + dl + dr // 2], fill=(245, 166, 35))
          img.save(sys.argv[1])
          PYEOF
          python3 /tmp/mkicon.py "$ICON"
          echo "Icon written to $ICON"

      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml

      - name: Create signing certificate and profile
        script: |
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@file:/tmp/cert_key --create
          else
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          fi

      - name: Add certificates to keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Set build number from TestFlight
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
          NEXT=$(($LATEST + 1))
          echo "Using build number $NEXT"
          agvtool new-version -all $NEXT

      - name: Build ipa
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - pantherdxpro@gmail.com
        notify:
          success: true
          failure: true
