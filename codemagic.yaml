workflows:
  ios-testflight:
    name: Melting Cheese iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        # Create this group in Codemagic (Teams -> Integrations / Environment variables)
        # and add: APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
        #          APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY
        - appstore_credentials
      vars:
        BUNDLE_ID: "food.meltingcheese.app"
        XCODE_SCHEME: "MeltingCheese"
        XCODE_PROJECT: "MeltingCheese.xcodeproj"
        APP_STORE_APP_ID: 6798319040
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml
          ls -la

      - name: Set build number from Codemagic
        script: |
          cd $CM_BUILD_DIR
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
          NEXT=$(($LATEST + 1))
          echo "Using build number $NEXT"
          agvtool new-version -all $NEXT

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Add internal tester group names here once they exist in App Store Connect:
        # beta_groups:
        #   - Internal Testers
      email:
        recipients:
          - pantherdxpro@gmail.com
        notify:
          success: true
          failure: true
