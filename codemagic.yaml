workflows:
  ios-testflight:
    name: Melting Cheese iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60


    # Apple Developer Portal key already connected to this Codemagic account.
    integrations:
      app_store_connect: TRT_ASC_KEY


    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "MeltingCheese"
        XCODE_PROJECT: "MeltingCheese.xcodeproj"
        APP_STORE_APP_ID: 6799911811
      ios_signing:
        distribution_type: app_store
        bundle_identifier: food.meltingcheese.app


    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true


    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen


      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml
